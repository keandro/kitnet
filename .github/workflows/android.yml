name: Android APK

on:
  push:
    branches: [ main ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publicar o APK em Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lfkitnets.p12"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/lfkitnets.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lf-kitnets-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: 1.0.${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "lf-kitnets-$VERSAO.apk"
          gh release create "v$VERSAO" "lf-kitnets-$VERSAO.apk" --target "$GITHUB_SHA" \
            --title "LF Kitnets $VERSAO" --generate-notes
